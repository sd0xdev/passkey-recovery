# gitleaks configuration for CI (.github/workflows/ci.yml). Default rules plus a narrow allowlist of values that are
# public by design: the well-known Anvil/Hardhat development keys of the local test chain, and the synthetic markers
# used by the unit and end-to-end tests. Anything else that looks like a secret fails the build.
[extend]
useDefault = true

[allowlist]
description = "Public Anvil dev keys and synthetic test markers"
regexes = [
  '''ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
  '''59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d''',
  '''5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a''',
  '''FAKEKEY[A-Za-z0-9_-]*''',
  '''E2eSyntheticPathKey[A-Za-z0-9_-]*''',
]
